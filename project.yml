# Map2Ride for iOS — XcodeGen project spec.
# Generate with:  xcodegen generate   (CI does this on macos-15)
# The app is built UNSIGNED (CODE_SIGNING_ALLOWED=NO): distribution is
# via the free sideloading channel (SideStore source feed — see
# INSTALL-FREE.md and apps.json) until an Apple Developer Program
# membership exists.
name: Maps2Uber
options:
  bundleIdPrefix: dev.vasilyespana
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  Maps2Uber:
    type: application
    platform: iOS
    sources:
      - path: Sources/Maps2Uber
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Map2Ride
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Schemes probed with canOpenURL to detect installed provider
        # apps (see RideProviders.swift `scheme`).
        LSApplicationQueriesSchemes:
          - uber
          - lyft
          - bolt
          - freenow
          - grab
          - gett
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vasilyespana.maps2uber
        # Parity train with Android: the multi-provider catalog +
        # second-provider settings shipped on Android as v1.5.0.
        MARKETING_VERSION: "1.5.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Maps2UberTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/Maps2UberTests
    dependencies:
      - target: Maps2Uber

schemes:
  Maps2Uber:
    build:
      targets:
        Maps2Uber: all
        Maps2UberTests: [test]
    test:
      targets:
        - Maps2UberTests
      gatherCoverageData: false
