name: Maps2Uber
options:
  bundleIdPrefix: dev.vasilyespana
  deploymentTarget:
    iOS: "17.0"

targets:
  Maps2Uber:
    type: application
    platform: iOS
    sources:
      - path: Sources/Maps2Uber
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Maps2Uber
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.vasilyespana.maps2uber
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
